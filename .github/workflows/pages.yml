# Publishes the STATIC DEMO (synthetic data only, no backend) to GitHub Pages:
#   https://<user>.github.io/vitalog/
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The real application (API, database, uploads) must NOT be hosted on Pages – see docs/07-DEPLOYMENT.md.
name: Pages (static demo)
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build:pages
        env: { VITE_BASE: "/${{ github.event.repository.name }}/" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
