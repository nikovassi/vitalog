# Publishes the browser version (local mode + optional encrypted Supabase sync) to GitHub Pages:
#   https://<user>.github.io/vitalog/
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Health data is never sent to GitHub: PDFs are processed in the browser; cloud data is E2E encrypted.
name: Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_BASE: "/${{ github.event.repository.name }}/"
          # optional encrypted cloud sync (public values; access is enforced by RLS)
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
