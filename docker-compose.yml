# Local development only. Production: see docs/DEPLOYMENT.md
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitalog_dev_only}
      POSTGRES_DB: vitalog
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalog"]
      interval: 3s
      retries: 20
volumes:
  dbdata:
